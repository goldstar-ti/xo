# XO: private day planner. Same layout as the other stacks on gs-sv-008.
#
# The app is published only on the docker0 address 172.17.0.1:8010, which
# nobbie-nginx reaches as host.docker.internal (server block xo.tifunction.com in
# GS-AUTO-043_NOBBIE/nginx/nginx.conf). Nothing listens on a LAN address.
#
# DATABASE_URL is assembled from POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB,
# so the app and the database container always agree.

name: xo

services:

  # ---------------------------------------------------------------------------
  # app: FastAPI and the static front end, one uvicorn worker
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      target: app
    image: xo-app
    container_name: xo-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Editable wording: a change on the host shows on the next page load, no rebuild or restart.
      - ./content/text:/srv/xo/content/text:ro
    networks:
      - internal
    ports:
      - "172.17.0.1:8010:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # db: PostgreSQL 16, used only by XO
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: xo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Australia/Perth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "5432"

volumes:
  postgres_data:
    driver: local

networks:
  internal:
    driver: bridge

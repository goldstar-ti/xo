# Today: the Today screen, including the daily lines (one is picked for each day).
#
# How to edit this file
# - Save the file and reload the page. There is no build and no restart.
# - Change the words after a colon. Keep the keys (the words before a colon) as they are:
#   the app looks the text up by key, and a missing key shows the key itself.
# - Keep the indentation. It uses two spaces and never tabs.
# - Put quote marks around any text that starts with a special character
#   (" ' { [ * & ! % @ #) or that contains a colon followed by a space, and around times such as '09:00'.
# - Write {name} where the app fills something in. Keep the same {name} in your wording.
# - If a file has a mistake, the app keeps the last good version of that file and logs a note.
#
today:
  matters_label: What matters most to me
  next_up: Next up
  greeting:
    morning: 'Morning, {name}.'
    afternoon: 'Afternoon, {name}.'
    evening: 'Evening, {name}.'
  entries:
    morning_checkin: Morning check-in
    evening_checkin: Evening check-in
    weekly_review: Weekly review
  next:
    leave_now: Leave now
    leave_in: 'Leave in {duration}'
    starts_in: 'Starts in {duration}'
    get_ready_in: 'Get ready in {duration}'
    at: 'at {time}'
    nothing_timed: Nothing else timed today
    next_appt: 'Next: {title}'
  nudge:
    not_started: Your plan is not started yet. Begin with one box.
    progress: 'My plan: {filled} of {total} boxes written. Next box: “{question}”'
    open: Open my plan
  tick:
    done: Done
    tick: Tick
    start: Start
    edit: Edit
    state_done: '{label}: done'
    state_open: '{label}: not done'
  three:
    heading: Today’s three
    all_tasks: All tasks
    empty_lead: Nothing chosen yet.
    choose: Choose up to three tasks
    empty_tail: for today.
  day:
    heading: The day
    edit_routine: Edit routine
    now: Now
  coming:
    heading: Coming up
    empty: Nothing due in the next week.
    court: Court
    appointment: Appointment
    task_due: Task due
    tracker: 'Tracker {ref}'
    bill: Bill
    bill_auto: Bill, automatic
  lines:
  - One thing at a time. The next thing is enough.
  - You do not have to catch the first link. Catching any link early still steers you back.
  - Eat something before you decide anything.
  - Showing up to today’s appointments counts.
  - Reaching out early is a strength.
  - Finished is better than perfect.
  - Do the small version.
  - You have kept going through harder days than this one.
  - People are still in your corner. Let one of them hear from you today.
  - Rest counts as doing something.
  - The plan works when it is used, even badly.
  - Noticing, then choice, then action. Noticing comes first.
  - Late is still better than absent. Go anyway.
  - Today only needs three things from you.
  - Drink some water. Then look at the list.
  - After a rough hour, check what your body needs first.
  - A missed day is a reason to restart today, from here.
  - You can do the first two minutes of almost anything.
  - Saying it awkwardly is better than not saying it.
  - A low number is not a verdict on you.
  - Measure how quickly you notice, and how quickly you recover.
  - Ask the question. The answer is usually kinder than the guess.

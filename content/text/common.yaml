# Shared words: buttons, dialogs, and loading and error lines used on every screen.
#
# How to edit this file
# - Save the file and reload the page. There is no build and no restart.
# - Change the words after a colon. Keep the keys (the words before a colon) as they are:
#   the app looks the text up by key, and a missing key shows the key itself.
# - Keep the indentation. It uses two spaces and never tabs.
# - Put quote marks around any text that starts with a special character
#   (" ' { [ * & ! % @ #) or that contains a colon followed by a space, and around times such as '09:00'.
# - Write {name} where the app fills something in. Keep the same {name} in your wording.
# - If a file has a mistake, the app keeps the last good version of that file and logs a note.
#
common:
  save: Save
  cancel: Cancel
  close: Close
  pin: Pin
  unpin: Unpin
  reset_position: Reset position
  clear: Clear
  up: Move up
  down: Move down
  drag: Drag to reorder
  more_actions: More actions
  no_match: Nothing matches.
  font_sample: The quick brown fox jumps over the lazy dog.
  delete: Delete
  delete_confirm: Tap again to delete
  not_saved: Not saved.
  working: Working…
  opening: Opening…
  reload: Reload
  no_connection: No connection to the server. Check your connection and reload.
  signed_out: Your sign-in ran out. Sign in again.
  sign_in: Sign in
  create_and_open: Create and open
  passwords_differ: The two passwords do not match.
  rel:
    today: today
    tomorrow: tomorrow
    yesterday: yesterday
    in_days: 'in {n} days'
    days_ago: '{n} days ago'

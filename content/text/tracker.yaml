# The Tracker screen: projects, their items, the list, board and report views, and the tracker widgets.
#
# How to edit this file
# - Save the file and reload the page. There is no build and no restart.
# - Change the words after a colon. Keep the keys (the words before a colon) as they are:
#   the app looks the text up by key, and a missing key shows the key itself.
# - Keep the indentation. It uses two spaces and never tabs.
# - Put quote marks around any text that starts with a special character
#   (" ' { [ * & ! % @ #) or that contains a colon followed by a space, and around times such as '09:00'.
# - Write {name} where the app fills something in. Keep the same {name} in your wording.
# - If a file has a mistake, the app keeps the last good version of that file and logs a note.
#
tracker:
  heading: Tracker
  new_item: New item
  new_project: New project
  project_settings: Project settings
  all_projects: All projects
  projects_aria: Projects
  views_aria: Views
  detail_aria: Item details
  no_projects: No projects yet. New project starts one.
  untitled: (no title)
  checklist_progress: '{done} of {all} ticked'

  # The pick lists a new project starts with. Each project can change its own in Project settings.
  # A status with "closed: true" closes an item. A link type's inverse is how the other item shows it.
  default_lists:
    status:
      - v: new
      - v: in progress
      - v: needs test
      - v: parked
      - {v: built, closed: true}
      - {v: verified, closed: true}
      - {v: won't do, closed: true}
    kind: [bug, feature, todo, doc, handover, knowledge]
    priority: [high, medium, low]
    area: [general]
    owner: [me, unassigned]
    link:
      - {v: blocks, inverse: blocked by}
      - {v: relates to, inverse: relates to}
      - {v: duplicates, inverse: duplicated by}

  tabs:
    list: List
    board: Board
    needs-test: Needs test
    handover: Handover
    pivot: Pivot
    history: History
    activity: Activity

  fields:
    ref: Ref
    title: Title
    status: Status
    kind: Kind
    priority: Priority
    area: Area
    owner: Owner
    due: Due
    updated: Updated
    labels: Labels
    label: Label
    project: Project
    body: Description
    test_steps: Test steps
    custom: Custom fields
    checklist: Checklist
    links: Links
    resolution: Resolution


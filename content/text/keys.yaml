# Keys: keyboard shortcut names and what each shortcut does.
#
# How to edit this file
# - Save the file and reload the page. There is no build and no restart.
# - Change the words after a colon. Keep the keys (the words before a colon) as they are:
#   the app looks the text up by key, and a missing key shows the key itself.
# - Keep the indentation. It uses two spaces and never tabs.
# - Put quote marks around any text that starts with a special character
#   (" ' { [ * & ! % @ #) or that contains a colon followed by a space, and around times such as '09:00'.
# - Write {name} where the app fills something in. Keep the same {name} in your wording.
# - If a file has a mistake, the app keeps the last good version of that file and logs a note.
keys:
  none: No key
  change_link: Change these keys in Settings
  table:
    action: What it does
    key: Key
  names:
    Enter: Enter
    Escape: Esc
    ArrowUp: Up
    ArrowDown: Down
    ArrowLeft: Left
    ArrowRight: Right
    ' ': Space
    Backspace: Backspace
    Delete: Delete
  actions:
    global_palette: Open the command list
    global_palette_alt: Open the command list (second key)
    global_shortcuts: Show this list of keys
    global_voice: Dictate into the box you are typing in
    global_zoom_in: Zoom in
    global_zoom_out: Zoom out
    global_zoom_reset: Reset zoom
    global_go: 'Go to {screen}'
    tasks_new: Add a task
    tasks_next: Next task
    tasks_next_alt: Next task (second key)
    tasks_prev: Previous task
    tasks_prev_alt: Previous task (second key)
    tasks_edit: Edit the task
    tasks_edit_alt: Edit the task (second key)
    tasks_done: Mark done, or not done
    tasks_pick: Pick for today
    tasks_priority: Change the priority
    tasks_left: Move to the column on the left
    tasks_right: Move to the column on the right
    tasks_view_list: Show as a list
    tasks_view_board: Show as a board
    tasks_view_table: Show as a table
    tracker_new: New item
    tracker_next: Next item
    tracker_prev: Previous item
    tracker_open: Open the first item
    tracker_back: Back to the list
    tracker_edit: Edit the title
    tracker_comment: Write a comment
    tracker_check: Add a checklist step
    tracker_select: Tick or untick the open item
    tracker_field_status: Set status
    tracker_field_priority: Set priority
    tracker_field_kind: Set kind
    tracker_field_area: Set area
    tracker_field_owner: Set owner
    tracker_close: Close the open item
    tracker_tab_prev: Previous view
    tracker_tab_next: Next view
    tracker_search: Search items
    tracker_help: Show these keys
    notes_new: New note
    notes_search: Search notes
    notes_bold: Bold
    notes_italic: Italic
    notes_preview: Switch between Write and Preview
    canvas_undo: Undo the last layout change
    canvas_redo: Redo the last undone layout change
    canvas_redo_alt: Redo the last undone layout change (second key)

  # What each widget shows, one line each (for the widget picker and docs).
  about:
    clock: The time and the date, large.
    week: Each day side by side with its appointments, bills and task due dates.
    month: A month grid with appointments, court dates, bills and task due dates.
    countdown: The number of days until each coming date, in order.
    next: The next thing on the day line, or when to get ready and leave.
    dayline: Routines, conditions, appointments and check-ins in time order, with Now marked.
    three: The tasks you picked for today.
    coming: Appointments, task due dates and bills ahead, soonest first.
    line: One line for the day, from the built-in lines and your own.
    tasks-list: The task lists, with the add box.
    quick: The add box on its own.
    diary-list: Appointments by day, with travel and getting-ready times.
    routine-list: Each routine with its time and the last seven days of ticks.
    obligations-list: Court dates, court tasks, conditions and reports. Choose one section or all four.
    bills-list: Open bills, soonest first, with the total for the next 30 days.
    money: Totals for bills overdue, due this week and due this month, paid by hand or automatically.
    checkins-week: Start today's check-ins and see which days have one saved.
    history: Your saved check-in answers, as you wrote and picked them.
    body: What you picked for your body in each check-in, day by day.
    plancard: 'Your plan card: warning signs, what you do instead, people and services.'
    nudge: How many plan boxes are filled, and the next one to write.
    launcher: Buttons for every add form and check-in.
    now: The time, the date and the next seven days with a dot for each entry.
    routine-week: Each routine with a dot for every day of this week you ticked it.
    last-28: Morning and evening check-ins saved or not saved over the last 28 days.
    four-weeks: The last four weeks of check-ins, a week to a row.
    timer: A timer you start, pause and reset. It keeps no record and sends no notice.
    reports: What you reported to your officer, newest first.
    next-court: The next court date with the tasks you listed for court.
    who-to-call: The people and numbers from your plan, as you wrote them.
    next-30: Bills due in the next 30 days by date, each with a bar for its amount.
    by-bill: Each open bill with its next due date and amount.
    add-bill: One button to add a bill.
    in-my-own-words: What you wrote in your plan, with what matters most to you first.
    yesterday-evening: Your evening check-in answers from yesterday, to read.
    weekly-checkin: Start the weekly review and see when you last did it.
    write-next-box: The next empty box in your plan, with a button to open My plan.
    boxes-to-write: The plan boxes that are still empty.
    scratch: A text area for quick notes. It is saved as a note called Scratch pad.

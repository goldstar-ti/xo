# Forms: the add and edit dialogs for appointments, tasks, routine items, bills, conditions and reports.
#
# How to edit this file
# - Save the file and reload the page. There is no build and no restart.
# - Change the words after a colon. Keep the keys (the words before a colon) as they are:
#   the app looks the text up by key, and a missing key shows the key itself.
# - Keep the indentation. It uses two spaces and never tabs.
# - Put quote marks around any text that starts with a special character
#   (" ' { [ * & ! % @ #) or that contains a colon followed by a space, and around times such as '09:00'.
# - Write {name} where the app fills something in. Keep the same {name} in your wording.
# - If a file has a mistake, the app keeps the last good version of that file and logs a note.
#
forms:
  saved: Saved
  deleted: Deleted
  more: More options
  weekdays:
    '1': Monday
    '2': Tuesday
    '3': Wednesday
    '4': Thursday
    '5': Friday
    '6': Saturday
    '0': Sunday
  appointment:
    heading_edit: Edit appointment
    heading_add: Add appointment
    heading_court: Add court date
    labels:
      title: What
      date: Date
      time: Start time
      where: Where
      travel: Travel, minutes
      prep: Getting ready, minutes
      notes: What to bring, who to ask for
      court: This is a court date
    hints:
      prep: Be generous. These set your get-ready and leave reminders.
      court: Adds a reminder one week before.
  task:
    heading_edit: Edit task
    heading_add: Add task
    labels:

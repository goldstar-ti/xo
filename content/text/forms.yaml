      step: First small step
      est: My guess, minutes
      due: Due
      project: Project
      priority: Priority
      tags: Categories
      subtasks: Subtasks
      energy: Focus it needs
      places: Where it can be done
      repeat: Repeats
      repeat_n: Every how many
      repeat_weekday: Day
      repeat_nth: Which one
      blocked_by: Waiting on
      actual: Actual time, minutes
    hints:
      step: Small enough to start in two minutes.
      est: The app adds half again.
      subtasks: Break it into small pieces and tick them off as you go.
      repeat: When you mark it done, XO adds the next one.
      blocked_by: The task stays out of Ready until these are done.
      actual: Fill this in once it is done. XO learns your pacing from it.
    placeholders:

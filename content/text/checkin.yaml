# Check-ins: the choices offered in the morning and evening check-ins and the five weekly review questions.
#
# How to edit this file
# - Save the file and reload the page. There is no build and no restart.
# - Change the words after a colon. Keep the keys (the words before a colon) as they are:
#   the app looks the text up by key, and a missing key shows the key itself.
# - Keep the indentation. It uses two spaces and never tabs.
# - Put quote marks around any text that starts with a special character
#   (" ' { [ * & ! % @ #) or that contains a colon followed by a space, and around times such as '09:00'.
# - Write {name} where the app fills something in. Keep the same {name} in your wording.
# - If a file has a mistake, the app keeps the last good version of that file and logs a note.
#
checkin:
  body_chips:
  - tired
  - wired
  - heavy
  - tense
  - restless
  - hungry
  - sore
  - numb
  - flat
  - thoughts racing
  - steady
  - okay
  sleep_chips:
  - under 4 hours
  - 4 to 5
  - 6 to 7
  - 8 or more
  day_chips:
  - spoke with someone in person or by phone
  - went outside
  - did something creative
  - kept an appointment
  - finished something
  - was alone most of the day
  - was online late with nothing to do
  - skipped a meal
  - cancelled or avoided something
  weekly_questions:
  - k: working
    q: What has been working since last time.
  - k: slipping
    q: What has been slipping.
  - k: changed
    q: What has changed in my life that my plan does not cover yet.
  - k: signs
    q: Which warning signs turned up, and what I did about them.
  - k: change
    q: What is the one thing I am changing before the next review.
  fuel_chips:
  - both
  - one of them
  - neither yet
  # The three answers to the warning signs question, in this order: none, yes, not sure.
  # The second and third open the "what I do instead" block.
  signs_chips:
  - 'no'
  - 'yes'
  - not sure
  title:
    morning: Morning check-in
    evening: Evening check-in
    weekly: Weekly review
  saved_suffix: ', already saved. You can change it.'
  save: Save check-in
  saved_toast: Check-in saved
  numbered: '{n}. {text}'
  morning:
    sleep: About how much sleep did you get?
    body: What is your body doing right now?
    body_hint: Pick any that fit. No need to name a feeling.
    fuel: Have you eaten or had water yet?
    fuel_hint: If not, do that before the next thing.
    goodlife: One thing I am doing today that belongs to the life I want
    from_plan: 'From your plan: {text}'
    picked: 'Today’s three: {n} chosen. '
    none_picked: 'No tasks chosen for today yet. '
    choose_tasks: Choose tasks
  evening:
    routine: 'Routine: {done} of {total} ticked'
    three: 'Today’s three: {done} of {total} done'
    did: Today I…
    did_hint: Pick everything that happened. Plain facts, no scoring.
    body: What is your body doing right now?
    ok: One thing that went all right today
    ok_hint: Small counts.
    first: The first thing I will do tomorrow
  signs:
    heading: Early warning signs
    not_written: 'Your early warning signs are not written yet. That is box 6 of your plan. '
    open_plan: Open my plan
    instead: What I do instead
    instead_missing: Not written yet. That is box 7 of your plan.
    people: People I can call
    people_missing: Not written yet. That is box 9 of your plan.
    open_card: Open my plan card
    action: What I did, or will do, about it
    question: Did any of your early warning signs turn up today?
    hint: Noticing early is the point. A yes here is the plan working.
  weekly:
    summary: 'This week: {done} of 7 evening check-ins done. Warning signs noted on {flagged} {days}.'
    day_one: day
    day_other: days
  landing:
    heading: Check-ins
    morning: Morning check-in
    evening: Evening check-in
    weekly: Weekly review
    last_14: Last 14 days
    day: Day
    col_morning: Morning
    col_evening: Evening
    done: done
    open: open
